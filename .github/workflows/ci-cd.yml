name: CI / CD

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: node --check src/app.js && node --check src/core.js
      - name: Run unit tests
        run: npm test

  build:
    name: Build
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare site
        run: |
          mkdir -p dist
          cp index.html styles.css dist/
          cp -R src dist/
      - name: Smoke test artifact
        run: |
          set -euo pipefail
          cd dist
          python3 -m http.server 8000 >/tmp/pomo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q 'PomoTodo'
          for f in styles.css src/*.js; do
            curl -fsS "http://127.0.0.1:8000/$f" >/dev/null
          done
          echo "Artifact smoke test passed"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
